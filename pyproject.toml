[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flipkart-tshirt-filler"
version = "0.1.0"
description = "Surgical zero-corruption Flipkart T-Shirt listing workbook automation tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "lxml>=5.0.0",
    "openpyxl>=3.1.0",
    "xlutils>=2.0.0",
    "xlwt>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "xlrd>=2.0.0",
]

[project.scripts]
flipkart-filler = "flipkart_filler.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
