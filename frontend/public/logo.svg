<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" width="64" height="64">
  <defs>
    <!-- Background Glass Linear Gradient -->
    <linearGradient id="sheetfill-glass-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Specular Highlight Top Edge -->
    <linearGradient id="specular-edge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7" />
    </linearGradient>

    <!-- Inner Shadow Filter -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Base Rounded Container with Liquid Glass Sheen -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#sheetfill-glass-bg)" filter="url(#soft-glow)" />

  <!-- Specular Top Border Refraction -->
  <rect x="5" y="5" width="54" height="54" rx="13" stroke="url(#specular-edge)" stroke-width="1.5" fill="none" />

  <!-- Frosted Spreadsheet Rows & Columns Structure -->
  <!-- Header row pill -->
  <rect x="14" y="16" width="36" height="6" rx="3" fill="#ffffff" fill-opacity="0.9" />

  <!-- Grid Cell Row 1 -->
  <rect x="14" y="26" width="10" height="7" rx="2" fill="#ffffff" fill-opacity="0.75" />
  <rect x="27" y="26" width="10" height="7" rx="2" fill="#ffffff" fill-opacity="0.75" />
  <rect x="40" y="26" width="10" height="7" rx="2" fill="#ffffff" fill-opacity="0.75" />

  <!-- Grid Cell Row 2 -->
  <rect x="14" y="36" width="10" height="7" rx="2" fill="#ffffff" fill-opacity="0.55" />
  <rect x="27" y="36" width="10" height="7" rx="2" fill="#ffffff" fill-opacity="0.55" />
  <rect x="40" y="36" width="10" height="7" rx="2" fill="#ffffff" fill-opacity="0.55" />

  <!-- Grid Cell Row 3 -->
  <rect x="14" y="46" width="10" height="5" rx="2" fill="#ffffff" fill-opacity="0.35" />
  <rect x="27" y="46" width="10" height="5" rx="2" fill="#ffffff" fill-opacity="0.35" />

  <!-- AI Sparkle Starburst in bottom right corner -->
  <path d="M46 39 C46 43 42 45 42 45 C42 45 46 47 46 51 C46 47 50 45 50 45 C50 45 46 43 46 39 Z" fill="#facc15" stroke="#ffffff" stroke-width="0.75" />
</svg>
